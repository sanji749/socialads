<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#071827;
      color:white;
    }
    .container{
      max-width:1200px;
      margin:auto;
      padding:30px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:30px;
    }
    .btn{
      padding:10px 16px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
    }
    .btn.secondary{
      background:#0b1220;
      border:1px solid rgba(255,255,255,0.12);
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }
    .card{
      background:#0b1220;
      border-radius:14px;
      padding:20px;
      box-shadow:0 8px 20px rgba(0,0,0,0.25);
    }
    .card h3{
      margin:0 0 10px;
      color:#9aa4b2;
      font-size:16px;
      font-weight:normal;
    }
    .number{
      font-size:32px;
      font-weight:bold;
    }
    .grid{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:20px;
    }
    .section-title{
      margin-top:0;
      margin-bottom:15px;
      font-size:22px;
    }
    .message-item{
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .message-item:last-child{
      border-bottom:none;
    }
    .message-item strong{
      display:block;
      margin-bottom:4px;
    }
    .muted{
      color:#9aa4b2;
      font-size:14px;
    }
    .ideas-list{
      padding-left:18px;
      margin:0;
    }
    .ideas-list li{
      margin-bottom:10px;
    }
    .actions{
      margin-top:30px;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }
    #errorBox{
      display:none;
      background:#3b0d0d;
      color:#fecaca;
      padding:12px 14px;
      border-radius:10px;
      margin-bottom:20px;
    }
    @media (max-width:900px){
      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="errorBox"></div>

    <div class="topbar">
      <div>
        <h1 id="welcomeText">Dashboard</h1>
        <p class="muted">Your marketing control center</p>
      </div>
      <button class="btn" onclick="logout()">Logout</button>
    </div>

    <div class="stats">
      <div class="card">
        <h3>Total Users</h3>
        <div class="number" id="totalUsers">0</div>
      </div>

      <div class="card">
        <h3>Total Messages</h3>
        <div class="number" id="totalMessages">0</div>
      </div>

      <div class="card">
        <h3>Campaign Ideas</h3>
        <div class="number" id="totalIdeas">0</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2 class="section-title">Latest Messages</h2>
        <div id="latestMessages">
          <p class="muted">Loading messages...</p>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Latest Campaign Ideas</h2>
        <ul id="ideasList" class="ideas-list"></ul>
      </div>
    </div>

    <div class="actions">
      <a href="index.html" class="btn secondary">Go to Homepage</a>
      <a href="ideas.html" class="btn secondary">View Ideas</a>
      <a href="admin.html" class="btn secondary" id="adminBtn" style="display:none;">Open Admin Panel</a>
      <button class="btn" onclick="loadDashboard()">Refresh Dashboard</button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");
    const name = localStorage.getItem("name");

    if (!token) {
      alert("Please login first");
      window.location.href = "login.html";
    }

    if (name) {
      document.getElementById("welcomeText").innerText = "Welcome, " + name;
    }

    if (role === "admin") {
      document.getElementById("adminBtn").style.display = "inline-block";
    }

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.innerText = message;
    }

    async function loadDashboard() {
      document.getElementById("errorBox").style.display = "none";

      try {
        const res = await fetch("/stats", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          }
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.message || "Failed to load dashboard");
          if (res.status === 401) {
            localStorage.clear();
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1000);
          }
          return;
        }

        document.getElementById("totalUsers").innerText = data.totalUsers || 0;
        document.getElementById("totalMessages").innerText = data.totalMessages || 0;
        document.getElementById("totalIdeas").innerText = (data.campaignIdeas || []).length;

        const messagesBox = document.getElementById("latestMessages");
        messagesBox.innerHTML = "";

        if (!data.latestMessages || !data.latestMessages.length) {
          messagesBox.innerHTML = '<p class="muted">No messages yet.</p>';
        } else {
          data.latestMessages.forEach(msg => {
            const div = document.createElement("div");
            div.className = "message-item";
            div.innerHTML = `
              <strong>${msg.name || "Unknown User"}</strong>
              <div class="muted">${msg.email || ""}</div>
              <div>${msg.message || ""}</div>
            `;
            messagesBox.appendChild(div);
          });
        }

        const ideasList = document.getElementById("ideasList");
        ideasList.innerHTML = "";

        (data.campaignIdeas || []).forEach(idea => {
          const li = document.createElement("li");
          li.textContent = idea;
          ideasList.appendChild(li);
        });

      } catch (error) {
        showError("Server not responding or dashboard route failed.");
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    loadDashboard();
  </script>
</body>
</html>
