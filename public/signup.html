<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signup</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#04111f,#071827,#0b2440);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .box{
      background:#0b1220;
      padding:32px 26px;
      border-radius:16px;
      width:100%;
      max-width:390px;
      box-shadow:0 20px 50px rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.06);
    }
    h2{text-align:center;margin-bottom:10px;font-size:32px}
    .sub{text-align:center;color:#9fb3c8;margin-bottom:22px;font-size:14px}
    input,button{
      width:100%;
      padding:13px;
      margin:8px 0;
      border:none;
      border-radius:10px;
      font-size:15px;
    }
    input{
      background:#111b2d;
      color:white;
      outline:none;
      border:1px solid transparent;
    }
    input:focus{
      border-color:#3b82f6;
      box-shadow:0 0 0 3px rgba(59,130,246,0.15);
    }
    button{
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-weight:700;
      margin-top:10px;
    }
    button:hover{background:#1d4ed8}
    button:disabled{opacity:.7;cursor:not-allowed}
    a{color:#60a5fa;text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
    .msg{margin-top:14px;min-height:22px;text-align:center;font-size:15px}
    .error{color:#f87171}
    .success{color:#4ade80}
    .footer{margin-top:16px;text-align:center;color:#d1d5db}
  </style>
</head>
<body>
  <div class="box">
    <h2>Signup</h2>
    <p class="sub">Create your account for Social Media Advertisement Management System</p>

    <form id="signupForm">
      <input type="text" id="name" placeholder="Enter Name" required>
      <input type="email" id="email" placeholder="Enter Email" required>
      <input type="password" id="password" placeholder="Enter Password" required>
      <button type="submit" id="signupBtn">Create Account</button>
    </form>

    <p class="footer">
      Already have an account? <a href="login.html">Login</a>
    </p>

    <p id="msg" class="msg"></p>
  </div>

  <script>
    const signupForm = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const msg = document.getElementById("msg");

    function showMessage(text, type = "error") {
      msg.innerText = text;
      msg.className = "msg " + type;
    }

    signupForm.addEventListener("submit", async function(e){
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!name || !email || !password) {
        showMessage("All fields are required.", "error");
        return;
      }

      signupBtn.disabled = true;
      signupBtn.innerText = "Creating...";
      showMessage("");

      try {
        const res = await fetch("/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        let data = {};
        const contentType = res.headers.get("content-type");

        if (contentType && contentType.includes("application/json")) {
          data = await res.json();
        } else {
          const text = await res.text();
          throw new Error(text || "Invalid server response");
        }

        if (res.ok) {
          showMessage(data.message || "Signup successful", "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1000);
        } else {
          showMessage(data.message || "Signup failed", "error");
        }
      } catch (error) {
        console.error("Signup Error:", error);
        showMessage("Server error. Try again.", "error");
      } finally {
        signupBtn.disabled = false;
        signupBtn.innerText = "Create Account";
      }
    });
  </script>
</body>
</html>
